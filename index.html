<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Experiment</title>
    <script src="jspsych7.3.1/jspsych.js"></script>
    <script src="jspsych7.3.1/plugin-preload.js"></script>
    <script src="jspsych7.3.1/plugin-browser-check.js"></script>
    <script src="jspsych7.3.1/plugin-fullscreen.js"></script>
    <script src="jspsych7.3.1/plugin-audio-keyboard-response.js"></script>
    <script src="jspsych7.3.1/plugin-call-function.js"></script>
    <script src="jspsych7.3.1/plugin-html-button-response.js"></script>
    <script src="jspsych7.3.1/plugin-html-keyboard-response.js"></script>
    <script src="jspsych7.3.1/plugin-survey-html-form.js"></script>
    <script src="jspsych7.3.1/plugin-maze-keyboard.js"></script>
    <link href="jspsych7.3.1/jspsych.css" rel="stylesheet" type="text/css" />
    <link href="jspsych7.3.1/maze.css" rel="stylesheet" type="text/css" />
    <style>
      body {
        background: #fafafa;
      }
      .screen-copy {
        max-width: 760px;
        margin: 0 auto;
        text-align: left;
        line-height: 1.55;
      }
      .syllable {
        font-size: 42px;
        font-weight: 600;
        letter-spacing: 0;
      }
      .choice-feedback {
        display: flex;
        justify-content: center;
        gap: 72px;
        align-items: center;
        font-size: 34px;
        font-weight: 600;
      }
      .choice-feedback span {
        min-width: 100px;
        padding: 16px 22px;
        border: 2px solid transparent;
        border-radius: 6px;
        transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, opacity 120ms ease;
      }
      .choice-feedback .correct {
        color: #167a3b;
        border-color: #167a3b;
        background: #e7f5ec;
        box-shadow: 0 0 0 4px rgba(22, 122, 59, 0.12);
      }
      .choice-feedback .incorrect {
        animation: incorrect-feedback-blink 180ms linear 0ms 4 alternate;
        background: #f8e7e7;
        border-color: #c62828;
        color: #8a2a2a;
        opacity: 0.42;
      }
      .choice-feedback .neutral {
        color: #777;
      }
      @keyframes incorrect-feedback-blink {
        from {
          border-color: #c62828;
          box-shadow: 0 0 0 4px rgba(198, 40, 40, 0.22);
        }
        to {
          border-color: #ff6b6b;
          box-shadow: 0 0 0 4px rgba(198, 40, 40, 0.04);
        }
      }
    </style>
  </head>
  <body></body>
  <script src="exp.js"></script>
</html>
